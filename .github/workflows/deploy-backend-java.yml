name: Deploy backend-java to Cloud Run

# main への push (backend-java 変更時) で Cloud Run にデプロイする。
# 認証は Workload Identity Federation (キーレス)。
on:
  push:
    branches: [main]
    paths:
      - "backend-java/**"
      - ".github/workflows/deploy-backend-java.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-java
  cancel-in-progress: false

env:
  SERVICE: healthfamily-api-java
  REGION: asia-northeast1

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # jOOQ のコード生成は実 PostgreSQL に接続して行う。
      # H2 では Postgres の text 型を主キーにできず、本番の型を再現できない。
      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Build (test 込み)
        run: ./mvnw -B --no-transfer-progress verify

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # jar は上で作成済み。Dockerfile はそれを取り込むだけなので --source で送る
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --timeout 300 \
            --concurrency 80 \
            --set-env-vars 'GOOGLE_CLIENT_ID=554199866293-7lb4232g2rp8ff2sgltke22tljtdmrcd.apps.googleusercontent.com' \
            --set-secrets 'DATABASE_JDBC_URL=DATABASE_JDBC_URL:latest,DATABASE_USER=DATABASE_USER:latest,DATABASE_PASSWORD=DATABASE_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest' \
            --quiet

      - name: Verify health
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --format 'value(status.url)')
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$URL/actuator/health" || echo 000)
            echo "health -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          exit 1
