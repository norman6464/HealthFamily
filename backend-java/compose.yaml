# 開発・統合テスト・jOOQ のコード生成で共有する PostgreSQL。
#
# スキーマは docker/postgres/schema.sql（本番から pg_dump で起こしたもの）を
# イメージに焼き込んでいる。テスト用に手書きしないのは、本番との差異に
# 気づけなくなるため。H2 のような別実装は使わず、常に本物の PostgreSQL で検証する。
services:
  postgres:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_DB: healthfamily
      POSTGRES_USER: healthfamily
      POSTGRES_PASSWORD: healthfamily
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthfamily -d healthfamily"]
      interval: 2s
      timeout: 3s
      retries: 30
