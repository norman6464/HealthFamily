# テスト用の設定。実際の秘密は含めない。

# 統合テストは compose の PostgreSQL に接続する。
# H2 のような別実装は使わない。本番と同じ PostgreSQL でのみ検証する。
# 起動: docker compose up -d
spring.datasource.url=jdbc:postgresql://localhost:55432/healthfamily
spring.datasource.username=healthfamily
spring.datasource.password=healthfamily

# compose の起動・停止は開発者と CI が行う。テストからは触らない。
spring.docker.compose.enabled=false

# 32 バイト以上でないと HS256 の鍵として拒否される
healthfamily.jwt.secret=test-secret-for-unit-tests-0123456789

healthfamily.google-oidc.client-id=test-client-id.apps.googleusercontent.com
healthfamily.google-oidc.client-secret=test-client-secret
